<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520"><rect width="1400" height="520" fill="white"/><style>.t{font-family:Arial,sans-serif;fill:#10284d}.h{font-size:34px;font-weight:700}.s{font-size:18px}.b{fill:#f7f9fc;stroke:#24579b;stroke-width:2}.e{font-family:Georgia,serif;font-size:23px;fill:#10284d}.a{stroke:#24579b;stroke-width:4;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#24579b"/></marker></defs><text x="700" y="55" text-anchor="middle" class="t h">Unified Trend–Area–Uncertainty Forecast Model</text><text x="700" y="88" text-anchor="middle" class="t s">Price geometry → deterministic signal → stochastic forecast distribution</text><rect x="40" y="145" rx="18" width="235" height="190" class="b"/><text x="157" y="185" text-anchor="middle" class="t s" font-weight="700">1  PRICE DATA</text><text x="157" y="240" text-anchor="middle" class="e">P(t)</text><text x="157" y="290" text-anchor="middle" class="t s">Observed time-series</text><line x1="275" y1="240" x2="300" y2="240" class="a"/><rect x="305" y="145" rx="18" width="235" height="190" class="b"/><text x="422" y="185" text-anchor="middle" class="t s" font-weight="700">2  SLOPE</text><text x="422" y="240" text-anchor="middle" class="e">S = ΔP / Δt</text><text x="422" y="290" text-anchor="middle" class="t s">Local direction</text><line x1="540" y1="240" x2="565" y2="240" class="a"/><rect x="570" y="145" rx="18" width="235" height="190" class="b"/><text x="687" y="185" text-anchor="middle" class="t s" font-weight="700">3  CURVATURE</text><text x="687" y="240" text-anchor="middle" class="e">C = dS/dt</text><text x="687" y="290" text-anchor="middle" class="t s">Acceleration / weakening</text><line x1="805" y1="240" x2="830" y2="240" class="a"/><rect x="835" y="145" rx="18" width="235" height="190" class="b"/><text x="952" y="185" text-anchor="middle" class="t s" font-weight="700">4  AREA PRESSURE</text><text x="952" y="240" text-anchor="middle" class="e">A = ∫(P−M)dt</text><text x="952" y="290" text-anchor="middle" class="t s">Accumulated displacement</text><line x1="1070" y1="240" x2="1095" y2="240" class="a"/><rect x="1100" y="145" rx="18" width="235" height="190" class="b"/><text x="1217" y="185" text-anchor="middle" class="t s" font-weight="700">5  TREND SCORE</text><text x="1217" y="240" text-anchor="middle" class="e">T = .55Z(S)+.20Z(C)+.25Z(A)</text><text x="1217" y="290" text-anchor="middle" class="t s">Unified deterministic signal</text><rect x="420" y="390" rx="18" width="560" height="90" class="b"/><text x="700" y="425" text-anchor="middle" class="t s" font-weight="700">STOCHASTIC FORECAST</text><text x="700" y="458" text-anchor="middle" class="e">Pₜ₊₁ = Pₜ exp[(μₜ − ½σ²) + σZ],   μₜ = μ₀ + λT,   Z ~ N(0,1)</text><line x1="1217" y1="335" x2="975" y2="410" class="a"/></svg>